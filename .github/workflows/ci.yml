# 每次推送到 main 或开 PR 时自动运行后端、前端与浏览器检查
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -r requirements.samples.txt
      - run: python -m ruff check backend scripts tests
      - run: python -m pytest tests -q

  frontend:
    name: Frontend (eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    name: Browser E2E (mock AI)
    runs-on: ubuntu-latest
    env:
      PW_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/browser/package-lock.json
      - run: pip install -r requirements.txt
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm ci --prefix tests/browser
      - run: tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser acceptance
        run: |
          export E2E_OUTPUT_DIR="$RUNNER_TEMP/career-compass-browser"
          python tests/e2e_server.py > "$RUNNER_TEMP/e2e-server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            trap - EXIT
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              cat "$RUNNER_TEMP/e2e-server.log"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          python - <<'PY'
          import time
          import httpx

          for _ in range(60):
              try:
                  if httpx.get('http://127.0.0.1:8011/api/health', timeout=1).status_code == 200:
                      break
              except httpx.HTTPError:
                  pass
              time.sleep(0.25)
          else:
              raise SystemExit('E2E server did not become ready. See e2e-server.log.')
          PY
          npm test --prefix tests/browser
          npm run test:ui --prefix tests/browser
